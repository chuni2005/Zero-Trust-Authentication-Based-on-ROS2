<!DOCTYPE html>
<html>
<head>
    <title>Zero-Trust Security Monitor</title>
    <style>
        .status-card { padding: 20px; transition: 0.5s; color: white; text-align: center; }
        .btn { padding: 10px 20px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
<h1>PC1 Security Dashboard</h1>

<!-- 狀態顯示區 -->
<div id="status-card" class="status-card" style="background-color: gray;">
    <h2 id="prediction-text">Waiting for System...</h2>
    <p id="feature-text">Features: None</p>
</div>

<hr>

<!-- 控制區 -->
<button class="btn" onclick="sendCommand('/cmd/start')">Trigger RPi1 ROS2</button>
<!-- 攻擊控制區 -->
<div style="border: 1px solid #ccc; padding: 15px; margin-top: 20px;">
    <h3>Select Attack Type</h3>
    <label><input type="radio" name="attackType" value="syn_flood" checked> SYN Flood (NMAP)</label><br>
    <label><input type="radio" name="attackType" value="nmap_scan"> NMAP Scanning</label><br>
    <label><input type="radio" name="attackType" value="ros2_crash"> ROS2 Node Crashing</label><br>
    <label><input type="radio" name="attackType" value="ros2_recon"> ROS2 Reconnaissance</label><br>
    <label><input type="radio" name="attackType" value="ros2_reflection"> ROS2 Reflection</label><br><br>

    <button class="btn" style="background: red; color: white;" onclick="submitAttack()">START ATTACK</button>
</div>
<script>
    // 1. 每秒更新一次狀態 (Polling)
    setInterval(() => {
        fetch('/api/get_status')
            .then(r => r.json())
            .then(data => {
                document.getElementById('status-card').style.backgroundColor = data.color;
                document.getElementById('prediction-text').innerText = data.prediction;
                document.getElementById('feature-text').innerText = "Last Features: " + data.last_features;
            });
    }, 1000);

    // 2. 發送控制指令
    function sendCommand(route) {
        fetch(route, {method: 'POST'});
    }

    // 3. 發送攻擊指令
    function submitAttack() {
        // 1. 抓取所有名稱為 attackType 的 radio 按鈕中，被選中的那一個
        const radios = document.getElementsByName('attackType');
        let selectedValue;

        for (const radio of radios) {
            if (radio.checked) {
                selectedValue = radio.value;
                break;
            }
        }

        console.log("Selected Attack:", selectedValue);

        // 2. 發送 Request 給 PC1 的後端 API
        fetch('/cmd/attack', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ type: selectedValue })
        })
            .then(response => response.json())
            .then(data => {
                alert("Attack command sent: " + selectedValue);
            })
            .catch(error => console.error('Error:', error));
    }
</script>
</body>
</html>
