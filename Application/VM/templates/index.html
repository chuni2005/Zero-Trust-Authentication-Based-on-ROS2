<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Trust Security Monitor</title>
    <link rel="stylesheet" href="./static/style.css">
    <script src="./static/chart.js"></script>
    <script src="../static/chartjs-plugin-annotation.js"></script>
</head>
<body>

    <div class="container">
        <h1>Zero Trust Authentication Based on ROS2</h1>

        <div class="monitor-container">
            <div class="chart-wrapper">
                <canvas id="securityChart"></canvas>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">總發動攻擊次數</div>
                <div class="metric-value" id="total-attacks">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">累積預測到攻擊</div>
                <div class="metric-value" id="detected-attacks">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">模型偵測成功率</div>
                <div class="metric-value" id="detection-rate">0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">當前模擬狀態</div>
                <div class="metric-value" id="active-attack-type" style="font-size: 1.15rem; color: #7f8c8d;">None</div>
            </div>
        </div>

        <div class="dashboard-grid">
            
            <div class="control-panel">
                <h3>System Control</h3>
                <div class="control-item">
                    <span class="control-label">Automatically send ROS2 packets</span>
                    <label class="switch">
                        <input type="checkbox" id="toggleSwitch">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="control-item" id="btn-container">
                    <button class="btn" id="triggerBtn" onclick="sendCommand('/cmd/start')">Trigger RPi1 ROS2</button>
                </div>
            </div>

            <div class="attack-panel">
                <h3>Select Attack Simulation</h3>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="attackType" value="syn_flood" checked> SYN Flood (NMAP)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attackType" value="nmap_scan"> NMAP Scanning
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attackType" value="ros2_crash"> ROS2 Node Crashing
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attackType" value="ros2_recon"> ROS2 Reconnaissance
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attackType" value="ros2_reflection"> ROS2 Reflection
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attackType" value="metasploit_syn"> Metasploit SYN Flood
                    </label>
                </div>
                <button class="btn btn-danger" onclick="submitAttack()">START ATTACK</button>
            </div>
            
        </div>
    </div>

<script>
    // 💡 關鍵修正 1：在離線環境下，必須手動向 Chart.js 註冊 Annotation 插件
    if (typeof ChartAnnotation !== 'undefined') {
        Chart.register(ChartAnnotation);
    } else {
        console.error("無法載入 Chartjs-plugin-annotation.js，請檢查檔案路徑是否正確。");
    }

    // 監聽開關狀態
    document.getElementById("toggleSwitch").addEventListener("change", function() {
        const triggerBtn = document.getElementById("triggerBtn");
        triggerBtn.style.display = this.checked ? "none" : "inline-block";
    });

    // ==========================================
    // 全域狀態與統計變數
    // ==========================================
    let currentPrediction = "Waiting...";
    let currentFeatures = "None";
    let currentStatusValue = 0; 
    let currentCardColor = "#7f8c8d"; 

    let totalAttackCount = 0;     
    let detectedAttackCount = 0;  
    let wasLastSafe = true;       

    // ==========================================
    // Chart.js 圖表初始化
    // ==========================================
    const ctx = document.getElementById('securityChart').getContext('2d');

    const securityChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], 
            datasets: [{
                label: 'Security Status',
                data: [], 
                borderColor: '#3498db',
                backgroundColor: 'rgba(52, 152, 219, 0.1)',
                borderWidth: 3,
                stepped: true, 
                tension: 0,
                pointRadius: 4,
                pointBackgroundColor: [] 
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 200 },
            scales: {
                x: {
                    grid: { color: 'rgba(200, 200, 200, 0.1)' },
                    title: { display: true, text: 'Time (Real-time)', font: { weight: 'bold' } }
                },
                y: {
                    min: -0.2,
                    max: 1.2,
                    ticks: {
                        stepSize: 1,
                        callback: function(value) {
                            if (value === 0) return 'Normal (0)';
                            if (value === 1) return 'ATTACK! (1)';
                            return '';
                        }
                    },
                    grid: { color: 'rgba(200, 200, 200, 0.1)' }
                }
            },
            plugins: {
                legend: { display: false },
                annotation: {
                    annotations: {} // 存放動態垂直線
                }
            }
        }
    });

    function updateMetricsUI() {
        document.getElementById('total-attacks').innerText = totalAttackCount;
        document.getElementById('detected-attacks').innerText = detectedAttackCount;
        if (totalAttackCount > 0) {
            const rate = Math.min(100, Math.round((detectedAttackCount / totalAttackCount) * 100));
            document.getElementById('detection-rate').innerText = rate + "%";
        } else {
            document.getElementById('detection-rate').innerText = "0%";
        }
    }

    // ==========================================
    // 核心 1：異步 Polling 後端狀態
    // ==========================================
    setInterval(() => {
        fetch('/api/get_status')
            .then(r => r.json())
            .then(data => {
                currentPrediction = data.prediction;
                currentFeatures = "Last Features: " + data.last_features;
                currentCardColor = data.color;

                const isAttacked = !(data.prediction.toLowerCase().includes('normal') || data.prediction.toLowerCase().includes('wait'));
                currentStatusValue = isAttacked ? 1 : 0;

                if (isAttacked && wasLastSafe) {
                    detectedAttackCount++;
                    updateMetricsUI();
                    wasLastSafe = false; 
                } else if (!isAttacked) {
                    wasLastSafe = true;  
                    document.getElementById('active-attack-type').innerText = "None";
                    document.getElementById('active-attack-type').style.color = "#7f8c8d";
                }

                const badgeCard = document.getElementById('status-badge-card');
                document.getElementById('prediction-text').innerText = currentPrediction;
                document.getElementById('feature-text').innerText = currentFeatures;
                badgeCard.style.backgroundColor = currentCardColor;
            })
            .catch(err => console.log("Connecting to backend..."));
    }, 1000);

    // ==========================================
    // 核心 2：前端時間軸流水流動
    // ==========================================
    setInterval(() => {
        const maxDataPoints = 18; 
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];

        securityChart.data.labels.push(timeStr);
        securityChart.data.datasets[0].data.push(currentStatusValue);
        
        const pointColor = currentStatusValue === 1 ? '#e74c3c' : '#3498db';
        securityChart.data.datasets[0].pointBackgroundColor.push(pointColor);

        if (securityChart.data.labels.length > maxDataPoints) {
            const removedLabel = securityChart.data.labels.shift();
            securityChart.data.datasets[0].data.shift();
            securityChart.data.datasets[0].pointBackgroundColor.shift();

            // 自動清理滾出螢幕外的垂直線
            const annotations = securityChart.options.plugins.annotation.annotations;
            for (const id in annotations) {
                if (annotations[id].value === removedLabel) {
                    delete annotations[id];
                }
            }
        }
        securityChart.update();
    }, 1000);

    function sendCommand(route) {
        fetch(route, {method: 'POST'});
    }

    // ==========================================
    // 核心 3：發送攻擊指令（優化時間戳記綁定）
    // ==========================================
    function submitAttack() {
        const radios = document.getElementsByName('attackType');
        let selectedValue;

        for (const radio of radios) {
            if (radio.checked) {
                selectedValue = radio.value;
                break;
            }
        }

        totalAttackCount++;
        updateMetricsUI();

        const activeAttackLabel = document.getElementById('active-attack-type');
        activeAttackLabel.innerText = selectedValue.toUpperCase();
        activeAttackLabel.style.color = '#e74c3c';

        // 💡 關鍵修正 2：如果圖表還沒初始化任何時間刻度，先抓當前時間
        let targetXValue = new Date().toTimeString().split(' ')[0];
        
        // 如果圖表中已經有流動的時間標籤，直接綁定最新（最右邊）的那一個刻度，確保紅線一定會畫在畫面上
        if (securityChart.data.labels.length > 0) {
            targetXValue = securityChart.data.labels[securityChart.data.labels.length - 1];
        }

        const annotationId = 'attack_line_' + Date.now();
        
        securityChart.options.plugins.annotation.annotations[annotationId] = {
            type: 'line',
            scaleID: 'x',
            value: targetXValue, // 綁定精準的 X 軸現存標籤
            borderColor: '#e74c3c',
            borderWidth: 2,
            borderDash: [5, 5],
            label: {
                display: true,
                content: '🎯 ' + selectedValue,
                position: 'start',
                backgroundColor: 'rgba(231, 76, 60, 0.85)',
                font: { size: 10, weight: 'bold' }
            }
        };
        
        securityChart.update();
        console.log(`[${targetXValue}] 攻擊垂直線已繪製: ${selectedValue}`);

        fetch('/cmd/attack', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: selectedValue })
        })
        .then(response => response.json())
        .catch(error => console.error('Error:', error));
    }
</script>
</body>
</html>
